<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Kontroli Bezpieczeństwa ULC</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0275d8; margin-bottom: 20px; }
        .menu { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px; }
        .btn { background-color: #343a40; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn:hover { background-color: #23272b; }
        .btn.active { background-color: #0275d8; }
        .pytanie { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 6px; border-left: 5px solid #0275d8; }
        .pytanie p { margin-top: 0; font-size: 16px; line-height: 1.5; }
        label { display: block; padding: 8px 10px; margin: 4px 0; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        label:hover { background: #e9ecef; }
        input[type="checkbox"] { margin-right: 10px; transform: scale(1.2); }
        .status { margin-top: 10px; font-weight: bold; padding: 8px; border-radius: 4px; display: none; }
        #wynik-box { display: none; background: #e2f0d9; border: 2px solid #385723; color: #385723; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-radius: 6px; margin-top: 20px; }
        .action-box { text-align: center; margin-top: 25px; }
        .btn-check { background-color: #28a745; font-size: 18px; padding: 12px 30px; }
        .btn-check:hover { background-color: #218838; }
    </style>
</head>
<body>
<div class="container">
    <h1>Operator Kontroli Bezpieczeństwa ULC</h1>
    <div class="menu">
        <button class="btn active" id="m1" onclick="pokaz(1)">Pytania 1 - 10</button>
        <button class="btn" id="m2" onclick="pokaz(2)">Pytania 11 - 20</button>
    </div>
    <div id="box"></div>
    <div class="action-box"><button class="btn btn-check" onclick="sprawdz()">Sprawdź wynik</button></div>
    <div id="wynik-box"></div>
</div>
<script>
const bazaPytan = [
    {
        id: 1, q: "1. Pasażer może wnieść do stref zastrzeżonych lotniska lub na pokład statku powietrznego przedmioty zabronione, wymienione w dodatku 4-C załącznika do rozporządzenia wykonawczego Komisji nr 2015/1998 pod warunkiem, że:",
        o: { "a": "odpowiedni organ wyrazi zgodę na przewóz danego przedmiotu", "b": "pasażer wnoszący przedmioty zabronione przeszedł sprawdzenie przeszłości, zgodnie z pkt 11.1.3 załącznika...", "c": "pasażerowi wnoszącemu przedmioty zabronione towarzyszy uzbrojona eskorta", "d": "przewoźnik lotniczy został poinformowany o pasażerze i przewożonym przez niego przedmiocie przed wejściem pasażerów na pokład statku powietrznego", "e": "spełnione są mające zastosowanie zasady ochrony lotnictwa" },
        c: ["a", "d", "e"]
    },
    {
        id: 2, q: "2. Podczas kontroli bezpieczeństwa osób, ręczny wykrywacz metali:",
        o: { "a": "jest podstawowym środkiem kontroli bezpieczeństwa", "b": "jest pomocny przy ustalaniu miejsca ukrycia materiałów wybuchowych", "c": "można stosować tylko jako dodatkowy środek kontroli bezpieczeństwa", "d": "można stosować zamiast kontroli manualnej", "e": "nie zastępuje wymogów kontroli manualnej", "f": "stosowany jest wyłącznie do kontroli bezpieczeństwa osób z ograniczoną możliwością poruszania się" },
        c: ["c", "e"]
    },
    {
        id: 3, q: "3. Wskaż kategorie pasażerów zwolnionych z kontroli bezpieczeństwa:",
        o: { "a": "funkcjonariusze Służby Ochrony Państwa wykonujący czynności związane z zapewnieniem ochrony ministrowi spraw wewnętrznych", "b": "osoby konwojowane pod uzbrojoną eskortą", "c": "personel misji dyplomatycznych", "d": "wicemarszałkowie Senatu" },
        c: ["a", "d"]
    },
    {
        id: 4, q: "4. Kontrolę bezpieczeństwa pasażera potencjalnie uciążliwego przeprowadza się, za pomocą:",
        o: { "a": "kontroli manualnej", "b": "psów do wykrywania materiałów wybuchowych", "c": "ręcznego wykrywacza metali", "d": "urządzenia rentgenowskiego" },
        c: ["a", "b", "c", "d"]
    },
    {
        id: 5, q: "5. Sprzęt ułatwiający podróżowanie osobom z ograniczoną możliwością poruszania się:",
        o: { "a": "poddaje się kontroli wzrokowej", "b": "poddaje się w miarę możliwości kontroli bezpieczeństwa jako bagaż kabinowy", "c": "zwolniony jest z kontroli bezpieczeństwa za zgodą przewoźnika lotniczego", "d": "zwolniony jest z kontroli bezpieczeństwa" },
        c: ["b"]
    },
    {
        id: 6, q: "6. Wskaż osoby niebędące pasażerami, które są zwolnione z kontroli bezpieczeństwa:",
        o: { "a": "funkcjonariusze Izby Skarbowej po okazaniu ważnej legitymacji służbowej", "b": "funkcjonariusze Służby Kontrwywiadu Wojskowego po okazaniu ważnej legitymacji służbowej", "c": "funkcjonariusze właściwych służb państwowych wykonujących zadania związane z pełnieniem wart ochronnych...", "d": "osoba posiadająca legitymację służbową wydaną przez Urząd Lotnictwa Cywilnego podczas wykonywania zadań", "e": "pracownicy i funkcjonariusze Agencji Bezpieczeństwa Wewnętrznego i żołnierze wyznaczeni na stanowisko służbowe..." },
        c: ["c"]
    },
    {
        id: 7, q: "7. Funkcjonariusze Straży Granicznej, Służby Celno-Skarbowej i Służby Ochrony Państwa mogą wejść do strefy zastrzeżonej lotniska na podstawie legitymacji służbowej, jeżeli są eskortowani przez osoby posiadające:",
        o: { "a": "certyfikat inspektora lotnictwa cywilnego wydany przez Prezesu Urzędu Lotnictwa Cywilnego", "b": "czasową kartę identyfikacyjną danego portu lotniczego", "c": "odpowiednik karty pokładowej", "d": "ważną kartę identyfikacyjną członka załogi" },
        c: ["b"]
    },
    {
        id: 8, q: "8. Czasowa karta identyfikacyjna portu lotniczego dla funkcjonariuszy Straży Granicznej, Policji, Służby Celno-Skarbowej oraz innych służb państwowych zawiera:",
        o: { "a": "datę wydania", "b": "nazwisko funkcjonariusza", "c": "nr PESEL", "d": "numer służbowy funkcjonariusza", "e": "oznaczenia stref, do których funkcjonariusz ma dostęp" },
        c: ["d", "e"]
    },
    {
        id: 9, q: "9. Kartę identyfikacyjną portu lotniczego zwraca się niezwłocznie podmiotowi wydającemu:",
        o: { "a": "w momencie opuszczania terytorium kraju na okres dłuższy niż 2 tygodnie", "b": "w momencie unieważnienia karty", "c": "w momencie zmiany pracodawcy", "d": "w przypadku gdy pracownik udaje się na zwolnienie lekarskie trwające powyżej 14 dni", "e": "w razie zmiany potrzeby dostępu do stref, w odniesieniu do których udzielono upoważnienia" },
        c: ["b", "c", "e"]
    },
    {
        id: 10, q: "10. Osoby niebędące pasażerami poddaje się kontroli bezpieczeństwa za pomocą:",
        o: { "a": "kontroli wzrokowej", "b": "ręcznego wykrywacza metali", "c": "urządzenia do wykrywania śladowych ilości materiałów wybuchowych w połączeniu z ręcznymi wykrywaczami metali", "d": "urządzeń do wykrywania śladowych ilości materiałów wybuchowych" },
        c: ["c"]
    },
    {
        id: 11, q: "11. Kartę identyfikacyjną portu lotniczego nosi się w widocznym miejscu przynajmniej wówczas:",
        o: { "a": "gdy jej posiadacz przechodzi przez punkt kontroli bezpieczeństwa", "b": "gdy jej posiadacz przechodzi przez punkt kontroli dostępu", "c": "gdy jej posiadacz znajduje się w strefach ogólnodostępnych lotniska", "d": "gdy jej posiadacz znajduje się w strefach zastrzeżonych lotniska" },
        c: ["d"]
    },
    {
        id: 12, q: "12. Po przeprowadzonej kontroli bezpieczeństwa, przesyłki zawierające ładunek lub pocztę, które znajdują się w innej części lotniska niż część krytyczna strefy zastrzeżonej, uważa się za zabezpieczone przed bezprawną ingerencją, jeśli:",
        o: { "a": "nie są pozostawione bez nadzoru, a dostęp do nich mają wyłącznie osoby zaangażowane w zabezpieczanie i ładowanie...", "b": "pozostają tam nie dłużej niż jedną godzinę", "c": "tak przewiduje program ochrony przewoźnika lotniczego" },
        c: ["a"]
    },
    {
        id: 13, q: "13. Ładunek i poczta poddawane są kontroli bezpieczeństwa z zastosowaniem co najmniej jednej z poniższych metod:",
        o: { "a": "kontrola wzrokowa", "b": "psy do wykrywania materiałów wybuchowych", "c": "sprawdzenie przeszłości nadawcy przesyłki", "d": "systemy do wykrywania urządzeń wybuchowych", "e": "urządzenia do wykrywania metali" },
        c: ["a", "b", "d"]
    },
    {
        id: 14, q: "14. Podczas kontroli bezpieczeństwa bagażu rejestrowanego stosuje się:",
        o: { "a": "kontrole wzrokową", "b": "psy do wykrywania urządzeń wybuchowych", "c": "systemy wykrywania urządzeń wybuchowych", "d": "urządzenia rentgenowskie", "e": "wykrywacze metali" },
        c: ["d"]
    },
    {
        id: 15, q: "15. Następujące przedmioty uznaje się za przedmioty zabronione w przesyłkach zawierających ładunek i pocztę:",
        o: { "a": "wiertarki i wiertła, w tym bezprzewodowe przenośne wiertarki elektryczne", "b": "wyposażenie wykorzystywane do sztuk walki", "c": "zabawki w kształcie broni, repliki i imitacje broni palnej...", "d": "zmontowane urządzenia wybuchowe i zapalające, które nie są przewożone zgodnie z zasadami..." },
        c: ["d"]
    },
    {
        id: 16, q: "16. Następujące przedmioty nie mogą być przewożone przez pasażerów w bagażu rejestrowanym:",
        o: { "a": "dynamit i proch strzelniczy", "b": "fajerwerki i inne materiały pirotechniczne", "c": "lonty", "d": "narzędzia z ostrzem lub trzonkiem o długości powyżej 6 cm...", "e": "urządzenia do porażania, takie jak paralizatory, tasery i pałki paraliżujące" },
        c: ["a", "b", "c"]
    },
    {
        id: 17, q: "17. Przedmioty zabronione do przewozu w bagażu kabinowym, o ile nie są zabronione do przewozu w bagażu rejestrowanym, mogą być:",
        o: { "a": "oznakowane przez przewoźnika jako bagaż kabinowy i skierowane do luku...", "b": "po usunięciu z bagażu kabinowego umieszczone w pojemniku i zniszczone...", "c": "przechowane na lotnisku za opłatą, w przeznaczonym do tego celu pomieszczeniu...", "d": "umieszczone przez pasażera w bagażu rejestrowanym podczas trwania odprawy biletowej" },
        c: ["b", "c", "d"]
    },
    {
        id: 18, q: "18. Następujące przedmioty nie mogą być wnoszone przez pasażerów do stref zastrzeżonych lotniska ani na pokład statku powietrznego:",
        o: { "a": "celowniki teleskopowe do broni palnej", "b": "fajerwerki", "c": "ładowarki do telefonów komórkowych", "d": "pałki gumowe", "e": "proce", "f": "strzały do łuków" },
        c: ["b", "d", "e", "f"]
    },
    {
        id: 19, q: "19. Podczas kontroli bezpieczeństwa bagażu kabinowego stosuje się:",
        o: { "a": "bramkowe wykrywacze metali", "b": "komory symulacyjne", "c": "kontrolę manualną", "d": "psy do wykrywania materiałów wybuchowych w połączeniu z kontrolą manualną", "e": "urządzenia do wykrywania metali" },
        c: ["c", "d"]
    },
    {
        id: 20, q: "20. Podczas kontroli bezpieczeństwa osób, urządzenia do wykrywania śladowych ilości materiałów wybuchowych, w połączeniu z ręcznymi wykrywaczami metali, można stosować:",
        o: { "a": "jako podstawową metodę kontroli bezpieczeństwa", "b": "tylko w przypadku, gdy operator kontroli bezpieczeństwa uzna kontrolę manualną za nieskuteczną lub niepożądaną", "c": "wyłącznie w stosunku do osób niepełnosprawnych" },
        c: ["b"]
    }
];
let aktywnePytania = [];

function pokaz(nr) {
    document.getElementById('wynik-box').style.display = 'none';
    let btns = document.querySelectorAll('.menu .btn');
    btns.forEach((b, idx) => b.classList.toggle('active', idx === (nr - 1)));

    let start = (nr - 1) * 10;
    aktywnePytania = bazaPytan.slice(start, start + 10);
    
    let html = '';
    aktywnePytania.forEach(p => {
        html += `<div class="pytanie" id="block-${p.id}"><p><strong>${p.q}</strong></p><div id="ans-${p.id}">`;
        for (let k in p.o) {
            html += `<label><input type="checkbox" name="p-${p.id}" value="${k}"> ${k.toUpperCase()}. ${p.o[k]}</label>`;
        }
        html += `</div><div class="status" id="stat-${p.id}"></div></div>`;
    });
    document.getElementById('box').innerHTML = html;
}

function sprawdz() {
    let pkt = 0;
    aktywnePytania.forEach(p => {
        let cb = document.querySelectorAll(`input[name="p-${p.id}"]:checked`);
        let odp = Array.from(cb).map(box => box.value);
        let statDiv = document.getElementById(`stat-${p.id}`);
        statDiv.style.display = 'block';
        
        if (odp.length === 0) {
            statDiv.style.color = 'orange';
            statDiv.innerHTML = '⚠️ Brak odpowiedzi!';
            return;
        }
        let ok = p.c.length === odp.length && p.c.every(v => odp.includes(v));
        if (ok) {
            statDiv.style.color = 'green';
            statDiv.innerHTML = '✓ Poprawna!';
            pkt++;
        } else {
            statDiv.style.color = 'red';
            statDiv.innerHTML = '✗ Błędna. Poprawna to: ' + p.c.join(', ').toUpperCase();
        }
    });
    let r = document.getElementById('wynik-box');
    r.style.display = 'block';
    r.innerHTML = 'Twój wynik w tym zestawie: ' + pkt + ' z ' + aktywnePytania.length;
}

// Uruchomienie na start
pokaz(1);
</script>
</body>
</html>
