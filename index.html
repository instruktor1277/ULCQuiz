<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz ULC</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; background-color: #f4f7f6; }
        h1, h2 { text-align: center; color: #2c3e50; }
        .menu-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .btn-menu { background: #34495e; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-menu.active { background: #3498db; }
        .question { background: white; padding: 20px; border-left: 5px solid #3498db; border-radius: 4px; margin-bottom: 20px; }
        .answers-group label { display: block; margin-bottom: 10px; cursor: pointer; }
        .btn-check { display: block; width: 200px; margin: 20px auto; background: #2ecc71; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #result { margin-top: 20px; padding: 15px; background: #e8f8f5; text-align: center; font-size: 18px; display: none; border: 2px solid #2ecc71; }
    </style>
</head>
<body>
    <h1>Operator Kontroli Bezpieczeństwa</h1>
    <h2>Oficjalna Baza Pytań ULC</h2>
    <hr>
    <div class="menu-container">
        <button class="btn-menu active" id="btn-p1" onclick="switchQuiz(1, 'btn-p1')">Pytania 1 - 10</button>
        <button class="btn-menu" id="btn-p2" onclick="switchQuiz(2, 'btn-p2')">Pytania 11 - 20</button>
    </div>
    <div id="quiz-container">Ładowanie pytań...</div>
    <button class="btn-check" onclick="checkAllAnswers()">Sprawdź wynik</button>
    <div id="result"></div>
    <script src="skrypt.js?v=1"></script>
</body>
</html>
