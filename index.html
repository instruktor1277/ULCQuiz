<body>
    <h1 style="text-align:center; color:#2c3e50; font-size:22px;">Operator Kontroli Bezpieczeństwa ULC</h1>
    <div class="menu">
        <button class="btn-m active" id="m1" onclick="zmien(1)">Pytania 1 - 10</button>
        <button class="btn-m" id="m2" onclick="zmien(2)">Pytania 11 - 20</button>
        <button class="btn-m" id="m3" onclick="zmien(3)">Pytania 21 - 28</button>
    </div>
    <div id="box"></div>
    <button class="btn-check" onclick="sprawdz()">Sprawdź wynik</button>
    <div id="wynik"></div>
    <script>
        const p1 = [
            {
                id: 1,
                q: "1. Pasażer może wnieść do stref zastrzelonych lotniska lub na pokład statku powietrznego przedmioty zabronione, wymienione w dodatku 4-C załącznika do rozporządzenia wykonawczego Komisji nr 2015/1998 pod warunkiem, że:",
                a: { a: "A) odpowiedni organ wyrazi zgodę na przewóz danego przedmiotu", b: "B) pasażer wnoszący przedmioty zabronione przeszedł sprawdzenie przeszłości, zgodnie z pkt 11.1.3 załącznika do rozporządzenia wykonawczego Komisji nr 2015/1998", c: "C) pasażerowi wnoszącemu przedmioty zabronione towarzyszy uzbrojona eskorta", d: "D) przewoźnik lotniczy został poinformowany o pasażerze i przewożonym przez niego przedmiocie przed wejściem pasażerów na pokład statku powietrznego", e: "E) spełnione są mające zastosowanie zasady ochrony lotnictwa" },
                c: ["a", "d", "e"]
            },
            {
                id: 2,
                q: "2. Podczas kontroli bezpieczeństwa osób, ręczny wykrywacz metali:",
                a: { a: "A) jest podstawowym środkiem kontroli bezpieczeństwa", b: "B) jest pomocny przy ustalaniu miejsca ukrycia materiałów wybuchowych", c: "C) można stosować tylko jako dodatkowy środek kontroli bezpieczeństwa", d: "D) można stosować zamiast kontroli manualnej", e: "E) nie zastępuje wymogów kontroli manualnej", f: "F) stosowany jest wyłącznie do kontroli bezpieczeństwa osób z ograniczoną możliwością poruszania się" },
                c: ["c", "e"]
            },
            {
                id: 3,
                q: "3. Wskaż kategorie pasażerów zwolnionych z kontroli bezpieczeństwa:",

                c: ["a", "d"]

                c: ["a", "b"]
            },
            {
                id: 5,
                q: "5. Sprzęt ułatwiający podróżowanie osobom z ograniczoną możliwością poruszania się:",

                c: ["b"]
            },
            {

                c: ["c", "e"]
            },
            {
                id: 7,
                q: "7. Funkcjonariusze Straży Granicznej, Służby Celno-Skarbowej i Służby Ochrony Państwa mogą wejść do strefy zastrzeżonej lotniska na podstawie legitymacji służbowej, jeżeli są eskortowani przez osoby posiadające:",
                a: { a: "A) certyfikat inspektora lotnictwa cywilnego wydany przez Prezesa Urzędu Lotnictwa Cywilnego", b: "B) czasową kartę identyfikacyjną danego portu lotniczego", c: "C) odpowiednik karty pokładowej", d: "D) ważną kartę identyfikacyjną członka załogi" },

            {

            }
        ];
        const p2 = [
            {
                id: 11,
                q: "11. Kartę identyfikacyjną portu lotniczego nosi się w widocznym miejscu przynajmniej wówczas:",
                a: { a: "A) gdy jej posiadacz przechodzi przez punkt kontroli bezpieczeństwa", b: "B) gdy jej posiadacz przechodzi przez punkt kontroli dostępu", c: "C) gdy jej posiadacz znajduje się w strefach ogólnodostępnych lotniska", d: "D) gdy jej posiadacz znajduje się w strefach zastrzeżonych lotniska" },
                c: ["d"]
            },
            {
                id: 12,
                q: "12. Po przeprowadzonej kontroli bezpieczeństwa, przesyłki zawierające ładunek lub pocztę, które znajdują się w innej części lotniska niż część krytyczna strefy zastrzeżonej, uważa się za zabezpieczone przed bezprawną ingerencją, jeśli:",
                a: { a: "A) nie są pozostawione bez nadzoru, a dostęp do nich mają wyłącznie osoby zaangażowane w zabezpieczanie i ładowanie ładunku oraz poczty na pokład statku powietrznego", b: "B) pozostają tam nie dłużej niż jedną godzinę", c: "C) tak przewiduje program ochrony przewoźnika lotniczego" },
                c: ["a"]
            },
            {
                id: 13,
                q: "13. Ładunek i poczta poddawane są kontroli bezpieczeństwa z zastosowaniem co najmniej jednej z poniższych metod:",
                a: { a: "A) kontrola wzrokowa", b: "B) psy do wykrywania materiałów wybuchowych", c: "C) sprawdzenie przeszłości nadawcy przesyłki", d: "D) systemy do wykrywania urządzeń wybuchowych", e: "E) urządzenia do wykrywania metali" },
                c: ["a", "b", "d"]
            },
            {
                id: 14,
                q: "14. Podczas kontroli bezpieczeństwa bagażu rejestrowanego stosuje się:",
                a: { a: "A) kontrolę wzrokową", b: "B) psy do wykrywania urządzeń wybuchowych", c: "C) systemy wykrywania urządzeń wybuchowych", d: "D) urządzenia rentgenowskie", e: "E) wykrywacze metali" },
                c: ["d"]
            },
            {
                id: 15,
                q: "15. Następujące przedmioty uznaje się za przedmioty zabronione w przesyłkach zawierających ładunek i pocztę:",
                a: { a: "A) wiertarki i wiertła, w tym bezprzewodowe przenośne wiertarki elektryczne", b: "B) wyposażenie wykorzystywane do sztuk walki", c: "C) zabawki w kształcie broni, repliki i imitacje broni palnej, które można pomylić z prawdziwą bronią", d: "D) zmontowane urządzenia wybuchowe i zapalające, które nie są przewożone zgodnie z mającymi zastosowanie zasadami bezpieczeństwa w lotnictwie cywilnym" },
                c: ["d"]
            },
            {
                id: 16,
                q: "16. Następujące przedmioty nie mogą być przewożone przez pasażerów w bagażu rejestrowanym:",
                a: { a: "A) dynamit i proch strzelniczy", b: "B) fajerwerki i inne materiały pirotechniczne", c: "C) lonty", d: "D) narzędzia z ostrzem lub trzonkiem o długości powyżej 6 cm, nadające się do użycia jako broń, takie jak śrubokręty i dłuta", e: "E) urządzenia do porażania, takie jak paralizatory, tasery i pałki paraliżujące" },
                c: ["a", "b", "c", "d", "e"]
            },
            {
                id: 17,
                q: "17. Przedmioty zabronione do przewozu w bagażu kabinowym, o ile nie są zabronione do przewozu w bagażu rejestrowanym, mogą być:",
                a: { a: "A) oznakowane przez przewoźnika lotniczego jako bagaż kabinowy i skierowane do luku bagażowego w trakcie kontroli bezpieczeństwa pasażerów i bagażu kabinowego", b: "B) po usunięciu z bagażu kabinowego umieszczone w specjalnie do tego celu przeznaczonym pojemniku i zniszczone na koszt przewoźnika lotniczego lub zarządzającego lotniskiem", c: "C) przechowane na lotnisku za opłatą, w przeznaczonym do tego celu pomieszczeniu, do czasu zgłoszenia się po ich odbiór pasażera", d: "D) umieszczone przez pasażera w bagażu rejestrowanym podczas trwania odprawy biletowo – bagażowej" },
                c: ["b", "c", "d"]
            },
            {
                id: 18,
                q: "18. Następujące przedmioty nie mogą być wnoszone przez pasażerów do stref zastrzeżonych lotniska ani na pokład statku powietrznego:",
                a: { a: "A) celowniki teleskopowe do broni palnej", b: "B) fajerwerki", c: "C) ładowarki do telefonów komórkowych", d: "D) pałki gumowe", e: "E) proce", f: "F) strzały do łuków" },
                c: ["b", "d", "e", "f"]
            },
            {
                id: 19,
                q: "19. Podczas kontroli bezpieczeństwa bagażu kabinowego stosuje się:",
                a: { a: "A) bramkowe wykrywacze metali", b: "B) komory symulacyjne", c: "C) kontrolę manualną", d: "D) psy do wykrywania materiałów wybuchowych w połączeniu z kontrolą manualną", e: "E) urządzenia do wykrywania metali" },
                c: ["c", "d"]
            },
            {
                id: 20,
                q: "20. Podczas kontroli bezpieczeństwa osób, urządzenia do wykrywania śladowych ilości materiałów wybuchowych, w połączeniu z ręcznymi wykrywaczami metali, można stosować:",
                a: { a: "A) jako podstawową metodę kontroli bezpieczeństwa", b: "B) tylko w przypadku, gdy operator kontroli bezpieczeństwa uzna kontrolę manualną za nieskuteczną lub niepożądaną", c: "C) wyłącznie w stosunku do osób niepełnosprawnych" },
                c: ["b"]
            }
        ];
        const p3 = [
            {
                id: 21,
                q: "21. Na lotniskach, na których nie funkcjonują lotnicze przejścia graniczne, formalności związane z przewozem broni i amunicji statkiem powietrznym dokonuje:",
                a: { a: "A) Policja", b: "B) przewoźnik lotniczy", c: "C) Służba Celno-Skarbowa", d: "D) Służba Ochrony Lotniska" },
                c: ["a"]
            },
            {
                id: 22,
                q: "22. Ręczny wykrywacz metali:",
                a: { a: "A) jest w stanie wykryć metalowe przedmioty żelazne", b: "B) jest w stanie wykryć metalowe przedmioty nieżelazne", c: "C) jest używany jako podstawowa metoda kontroli bezpieczeństwa osób", d: "D) jest w stanie wykryć przedmioty z tworzyw sztucznych", e: "E) posiada wskaźnik wizualny sygnalizujący, że urządzenie funkcjonuje" },
                c: ["a", "b", "e"]
            },
            {
                id: 23,
                q: "23. Kontrolą manualną jest zespół czynności kontroli bezpieczeństwa:",
                a: { a: "A) wykonywanych ręcznie bez ingerencji w wewnętrzne powłoki ciała oraz w sposób powodujący w jak najmniejszym stopniu naruszenie intymności, w celu wykrycia w odzieży lub na ciele oraz w przedmiotach osobistych kontrolowanej osoby zabronionych przedmiotów, urządzeń lub substancji", b: "B) wykonywanych ręcznie z ingerencją w wewnętrzne powłoki ciała, w celu wykrycia w odzieży lub ciele oraz w przedmiotach osobistych kontrolowanej osoby zabronionych przedmiotów, urządzeń lub substancji", c: "C) wykonywanych za pomocą bramki do wykrywania metali i ręcznego wykrywacza metali, w celu wykrycia w odzieży lub na ciele oraz w przedmiotach osobistych kontrolowanej osoby zabronionych przedmiotów, urządzeń lub substancji" },
                c: ["a"]
            },
            {
                id: 24,
                q: "24. Pracownik służby ochrony lotniska przy wykonywaniu zadań z zakresu kontroli bezpieczeństwa w lotnictwie cywilnym ma prawo do:",
                a: { a: "A) dokonywania kontroli manualnej i przeglądania zawartości bagażu", b: "B) korzystania ze środków chemicznych oraz wykorzystania psów do wykrywania przedmiotów lub substancji, które mogą stanowić przedmiot niebezpieczny", c: "C) niedopuszczenia do wejścia na obszar lub do obiektu podlegających ochronie osoby nieposiadającej wymaganych uprawnień", d: "D) samodzielnej neutralizacji na stanowisku kontrolnym wykrytego urządzenia wybuchowego", e: "E) zwolnienia z kontroli bezpieczeństwa osób poruszających się na wózku inwalidzkim" },
                c: ["a", "b", "c"]
            },
            {
                id: 25,
                q: "25. W szkoleniu w celu uzyskania certyfikatu operatora kontroli bezpieczeństwa może wziąć udział osoba:",
                a: { a: "A) co do której ustalono brak negatywnych przesłanek do wykonywania przez tę osobę kontroli bezpieczeństwa w lotnictwie cywilnym", b: "B) która ukończyła szkolenie świadomości ochrony lotnictwa cywilnego", c: "C) potrafiąca nawiązać kontakt z osobami kontrolowanymi w co najmniej jednym języku obcym w podstawowym zakresie", d: "D) zamieszkująca na terenie Polski co najmniej 3 lata" },
                c: ["a", "b"]
            },
            {
                id: 26,
                q: "26. Bramka do wykrywania metali:",
                a: { a: "A) jest na stałe przymocowana do twardego podłoża", b: "B) musi być odporna na zalanie wodą", c: "C) wykrywa przedmiot metalowy niezależnie od jego położenia i usytuowania", d: "D) wykrywa przedmioty z plastiku niezależnie od ich położenia i usytuowania" },
                c: ["a", "c"]
            },
            {
                id: 27,
                q: "27. Podczas kontroli bezpieczeństwa zaopatrzenia portu lotniczego zastosowane środki lub metoda:",
                a: { a: "A) są zależne od częstotliwości dostaw v danym porcie lotniczym", b: "B) uwzględniają rodzaj zaopatrzenia", c: "C) zapewniają dostateczny poziom bezpieczeństwa, na ile to możliwe, jeżeli chodzi o wykrycie przedmiotów zabronionych ukrytych w zaopatrzeniu", d: "D) zawsze przewidują wykorzystanie psów do wykrywania materiałów wybuchowych w powiązaniu z systemami wykrywania materiałów wybuchowych" },
                c: ["b", "c"]
            },
            {
                id: 28,
                q: "28. Następujące przedmioty uznaje się za przedmioty zabronione w zaopatrzeniu portu lotniczego:",
                a: { a: "A) aerozole odstraszające zwierzęta", b: "B) farby drogowe w pojemnikach o pojemności powyżej 10 litrów", c: "C) granaty dymne", d: "D) masy bitumiczne uszczelniające w pojemnikach o pojemności powyżej 20 litrów", e: "E) pistolety sygnałowe", f: "F) spirytus salicylowy" },
                c: ["a", "c", "e"]
            }
        ];
        let baza = p1;
        function zmien(nr) {
            document.getElementById('wynik').style.display = 'none';
            document.getElementById('m1').classList.toggle('active', nr === 1);
            document.getElementById('m2').classList.toggle('active', nr === 2);
            document.getElementById('m3').classList.toggle('active', nr === 3);
            if (nr === 1) baza = p1;
            else if (nr === 2) baza = p2;
            else if (nr === 3) baza = p3;
            rysuj();
        }
        function rysuj() {
            let html = '';
            baza.forEach(p => {
                html += '<div class="question"><p><b>' + p.q + '</b></p>';
                for (let k in p.a) {
                    html += '<label><input type="checkbox" name="p-' + p.id + '" value="' + k + '"> ' + p.a[k] + '</label>';
                }
                html += '<div id="f-' + p.id + '" style="margin-top:8px; font-weight:bold;"></div></div>';
            });
            document.getElementById('box').innerHTML = html;
        }
        function sprawdz() {
            let pkt = 0;
            baza.forEach(p => {
                let cb = document.querySelectorAll('input[name="p-' + p.id + '"]:checked');
                let odp = Array.from(cb).map(box => box.value);
                let f = document.getElementById('f-' + p.id);
                if (odp.length === 0) { f.innerHTML = '<span style="color:orange">⚠️ Brak odpowiedzi!</span>'; return; }
                let ok = p.c.length === odp.length && p.c.every(v => odp.includes(v));
                if (ok) { f.innerHTML = '<span style="color:green">✓ Poprawna!</span>'; pkt++; }
                else { f.innerHTML = '<span style="color:red">✗ Błędna. Poprawna: ' + p.c.join(', ').toUpperCase() + '</span>'; }
            });
            let r = document.getElementById('wynik');
            r.style.display = 'block';
            r.innerHTML = 'Wynik zestawu: ' + pkt + ' z ' + baza.length;
        }
        rysuj();
    </script>
</body>
</html>
