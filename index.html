<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Kontroli Bezpieczeństwa ULC</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0275d8; margin-bottom: 20px; }
        .menu { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px; }
        .btn { background-color: #343a40; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn:hover { background-color: #23272b; }
        .btn.active { background-color: #0275d8; }
        .pytanie { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 6px; border-left: 5px solid #0275d8; }
        .pytanie p { margin-top: 0; font-size: 16px; line-height: 1.5; }
        label { display: block; padding: 8px 10px; margin: 4px 0; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        label:hover { background: #e9ecef; }
        input[type="checkbox"] { margin-right: 10px; transform: scale(1.2); }
        .status { margin-top: 10px; font-weight: bold; padding: 8px; border-radius: 4px; display: none; }
        #wynik-box { display: none; background: #e2f0d9; border: 2px solid #385723; color: #385723; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-radius: 6px; margin-top: 20px; }
        .action-box { text-align: center; margin-top: 25px; }
        .btn-check { background-color: #28a745; font-size: 18px; padding: 12px 30px; }
        .btn-check:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h1>Operator Kontroli Bezpieczeństwa ULC</h1>
    
    <div class="menu">
        <button class="btn active" id="m1" onclick="zmienZestaw(1)">Pytania 1 - 10</button>
        <button class="btn" id="m2" onclick="zmienZestaw(2)">Pytania 11 - 20</button>
        <button class="btn" id="m3" onclick="zmienZestaw(3)">Pytania 21 - 30</button>
        <button class="btn" id="m4" onclick="zmienZestaw(4)">Pytania 31 - 40</button>
    </div>

    <div id="box"></div>

    <div class="action-box">
        <button class="btn btn-check" onclick="sprawdzTest()">Sprawdź wynik</button>
    </div>

    <div id="wynik-box"></div>
</div>

<script>
// --- TUTAJ W KOLEJNYM KROKU WKLEIMY BAZĘ PYTAŃ ---
</script>

</body>
</html>
