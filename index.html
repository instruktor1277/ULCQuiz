<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz ULC</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; background-color: #f4f7f6; }
        h1, h2 { text-align: center; color: #2c3e50; }
        .menu-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .btn-menu { background: #34495e; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-menu.active { background: #3498db; }
        .question { background: white; padding: 20px; border-left: 5px solid #3498db; border-radius: 4px; margin-bottom: 20px; }
        .answers-group label { display: block; margin-bottom: 10px; cursor: pointer; }
        .btn-check { display: block; width: 200px; margin: 20px auto; background: #2ecc71; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #result { margin-top: 20px; padding: 15px; background: #e8f8f5; text-align: center; font-size: 18px; display: none; border: 2px solid #2ecc71; }
    </style>
</head>
<body>
    <h1>Operator Kontroli Bezpieczeństwa</h1>
    <h2>Oficjalna Baza Pytań ULC - Test</h2>
    <hr>
    <div class="menu-container">
        <button class="btn-menu active" id="btn-p1" onclick="switchQuiz(1, 'btn-p1')">Pytania 1 - 10</button>
        <button class="btn-menu" id="btn-p2" onclick="switchQuiz(2, 'btn-p2')">Pytania 11 - 20</button>
    </div>
    <div id="quiz-container">Ładowanie pytań...</div>
    <button class="btn-check" onclick="checkAllAnswers()">Sprawdź wynik</button>
    <div id="result"></div>

    <script>
        const quizData1 = [
           const quizData1 = [
    {
        id: 1,
        question: "1. Pasażer może wnieść do stref zastrzelonych lotniska lub na pokład statku powietrznego przedmioty zabronione, wymienione w dodatku 4-C załącznika do rozporządzenia wykonawczego Komisji nr 2015/1998 pod warunkiem, że:",
        answers: {
            a: "A) odpowiedni organ wyrazi zgodę na przewóz danego przedmiotu",
            b: "B) pasażer wnoszący przedmioty zabronione przeszedł sprawdzenie przeszłości, zgodnie z pkt 11.1.3 załącznika do rozporządzenia wykonawczego Komisji nr 2015/1998",
            c: "C) pasażerowi wnoszącemu przedmioty zabronione towarzyszy uzbrojona eskorta",
            d: "D) przewoźnik lotniczy został poinformowany o pasażerze i przewożonym przez niego przedmiocie przed wejściem pasażerów na pokład statku powietrznego",
            e: "E) spełnione są mające zastosowanie zasady ochrony lotnictwa"
        },
        correct: ["a", "d", "e"]
    },
    {
        id: 2,
        question: "2. Podczas kontroli bezpieczeństwa osób, ręczny wykrywacz metali:",
        answers: {
            a: "A) jest podstawowym środkiem kontroli bezpieczeństwa",
            b: "B) jest pomocny przy ustalaniu miejsca ukrycia materiałów wybuchowych",
            c: "C) można stosować tylko jako dodatkowy środek kontroli bezpieczeństwa",
            d: "D) można stosować zamiast kontroli manualnej",
            e: "E) nie zastępuje wymogów kontroli manualnej",
            f: "F) stosowany jest wyłącznie do kontroli bezpieczeństwa osób z ograniczoną możliwością poruszania się"
        },
        correct: ["c", "e"]
    },
    {
        id: 3,
        question: "3. Wskaż kategorie pasażerów zwolnionych z kontroli bezpieczeństwa:",
        answers: {
            a: "A) funkcjonariusze Służby Ochrony Państwa wykonujący czynności związane z zapewnieniem ochrony ministrowi spraw wewnętrznych",
            b: "B) osoby konwojowane pod uzbrojoną eskortą",
            c: "C) personel misji dyplomatycznych",
            d: "D) wicemarszałkowie Senatu"
        },
        correct: ["a", "d"]
    },
    {
        id: 4,
        question: "4. Kontrolę bezpieczeństwa pasażera potencjalnie uciążliwego przeprowadza się, za pomocą:",
        answers: {
            a: "A) kontroli manualnej",
            b: "B) psów do wykrywania materiałów wybuchowych",
            c: "C) ręcznego wykrywacza metali",
            d: "D) urządzenia rentgenowskiego"
        },
        correct: ["a", "b"]
    },
    {
        id: 5,
        question: "5. Sprzęt ułatwiający podróżowanie osobom z ograniczoną możliwością poruszania się:",
        answers: {
            a: "A) poddaje się kontroli wzrokowej",
            b: "B) poddaje się w miarę możliwości kontroli bezpieczeństwa jako bagaż kabinowy",
            c: "C) zwolniony jest z kontroli bezpieczeństwa za zgodą przewoźnika lotniczego",
            d: "D) zwolniony jest z kontroli bezpieczeństwa"
        },
        correct: ["b"]
    }
];
        ];
        const quizData2 = [
            {
                id: 11,
                question: "11. Kartę identyfikacyjną portu lotniczego nosi się w widocznym miejscu:",
                answers: { a: "A) w strefach ogólnodostępnych", b: "B) w strefach zastrzeżonych lotniska" },
                correct: ["b"]
            }
        ];
        let currentQuizData = quizData1;
        function switchQuiz(partNumber, buttonId) {
            document.getElementById('result').style.display = 'none';
            document.querySelectorAll('.btn-menu').forEach(btn => btn.classList.remove('active'));
            document.getElementById(buttonId).classList.add('active');
            currentQuizData = (partNumber === 1) ? quizData1 : quizData2;
            renderQuiz();
        }
        function renderQuiz() {
            const quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = '';
            currentQuizData.forEach((q) => {
                let answersHtml = '';
                for (let key in q.answers) {
                    answersHtml += '<label><input type="checkbox" name="question-' + q.id + '" value="' + key + '"> ' + q.answers[key] + '</label>';
                }
                const div = document.createElement('div');
                div.className = 'question';
                div.innerHTML = '<p style="font-weight:bold;">' + q.question + '</p><div class="answers-group">' + answersHtml + '</div><div id="feedback-' + q.id + '" style="margin-top:10px;font-weight:bold;"></div>';
                quizContainer.appendChild(div);
            });
        }
        function checkAllAnswers() {
            let score = 0;
            currentQuizData.forEach((q) => {
                const checked = document.querySelectorAll('input[name="question-' + q.id + '"]:checked');
                const userAnswers = Array.from(checked).map(box => box.value);
                const feedback = document.getElementById('feedback-' + q.id);
                if (userAnswers.length === 0) { feedback.innerHTML = "<span style='color:orange;'>⚠️ Brak odpowiedzi!</span>"; return; }
                const isCorrect = q.correct.length === userAnswers.length && q.correct.every(val => userAnswers.includes(val));
                if (isCorrect) { feedback.innerHTML = "<span style='color:green;'>✓ Poprawna!</span>"; score++; }
                else { feedback.innerHTML = "<span style='color:red;'>✗ Błędna. Poprawna: " + q.correct.join(", ").toUpperCase() + "</span>"; }
            });
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<h3>Wynik: ' + score + ' z ' + currentQuizData.length + '</h3>';
        }
        renderQuiz();
    </script>
</body>
</html>
