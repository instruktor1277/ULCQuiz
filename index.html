<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz ULC - Operator Kontroli Bezpieczeństwa</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; background-color: #f4f7f6; color: #333; }
        h1 { color: #2c3e50; text-align: center; }
        .menu-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .btn-menu { background: #34495e; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-menu:hover { background: #2c3e50; }
        .btn-menu.active { background: #3498db; }
        .question { background: white; padding: 20px; border-left: 5px solid #3498db; border-radius: 4px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .answers-group label { display: block; margin-bottom: 8px; cursor: pointer; padding: 8px; border-radius: 4px; transition: background 0.2s; }
        .answers-group label:hover { background: #f0f4f8; }
        .btn-check { display: block; width: 200px; margin: 30px auto; background: #2ecc71; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; text-align: center; }
        .btn-check:hover { background: #27ae60; }
        #result { margin-top: 20px; padding: 15px; background: #e8f8f5; border-radius: 4px; text-align: center; font-size: 18px; display: none; }
    </style>
</head>
<body>

    <h1>Operator Kontroli Bezpieczeństwa w Lotnictwie Cywilnym</h1>
    <hr style="border: 0; height: 1px; background: #ccc; margin-bottom: 20px;">

    <!-- Menu wyboru zestawów pytań -->
    <div class="menu-container">
        <button class="btn-menu" id="btn-p1" onclick="loadQuizScript('pytania1.js', 'btn-p1')">Pytania 1 - 10</button>
        <button class="btn-menu" id="btn-p2" onclick="loadQuizScript('pytania2.js', 'btn-p2')">Pytania 11 - 20</button>
        <!-- Tutaj w przyszłości dopiszemy kolejne przyciski, np.:
        <button class="btn-menu" id="btn-p3" onclick="loadQuizScript('pytania3.js', 'btn-p3')">Pytania 21 - 30</button> 
        -->
    </div>

    <!-- Miejsce generowania pytań -->
    <div id="quiz-container"></div>

    <button class="btn-check" onclick="checkAllAnswers()">Sprawdź wynik</button>

    <div id="result"></div>

    <script>
        // Funkcja dynamicznie ładująca wybrany plik z pytaniami
        function loadQuizScript(scriptName, buttonId) {
            // Ukryj poprzedni wynik i wyczyść kontener
            document.getElementById('result').style.display = 'none';
            document.getElementById('quiz-container').innerHTML = '<p style="text-align:center;">Ładowanie pytań...</p>';
            
            // Podświetlenie aktywnego przycisku w menu
            document.querySelectorAll('.btn-menu').forEach(btn => btn.classList.remove('active'));
            document.getElementById(buttonId).classList.add('active');

            // Usunięcie poprzednio załadowanego skryptu pytań (jeśli istnieje)
            const oldScript = document.getElementById('dynamic-quiz-data');
            if (oldScript) oldScript.remove();

            // Tworzenie nowego elementu skryptu z unikalnym parametrem (zapobiega cache w przeglądarce)
            const script = document.createElement('script');
            script.id = 'dynamic-quiz-data';
            script.src = scriptName + '?v=' + new Date().getTime();
            
            // Kiedy plik JS się załaduje, uruchom generowanie pytań
            script.onload = function() {
                renderQuiz();
            };
            
            document.body.appendChild(script);
        }

        // Funkcja budująca formularz na ekranie
        function renderQuiz() {
            const quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = '';

            // Zmienna quizData pochodzi z dynamicznie załadowanego pliku .js
            if (typeof quizData === 'undefined') {
                quizContainer.innerHTML = '<p style="color:red; text-align:center;">Błąd ładowania pytań.</p>';
                return;
            }

            quizData.forEach((q) => {
                let answersHtml = '';
                for (let key in q.answers) {
                    answersHtml += `
                        <label>
                            <input type="checkbox" name="question-${q.id}" value="${key}" style="margin-right: 10px;">
                            ${q.answers[key]}
                        </label>
                    `;
                }

                const questionElement = document.createElement('div');
                questionElement.className = 'question';
                questionElement.innerHTML = `
                    <p style="font-weight: bold; font-size: 16px; color: #2c3e50; margin-top: 0;">${q.question}</p>
                    <div class="answers-group" id="answers-${q.id}">
                        ${answersHtml}
                    </div>
                    <div id="feedback-${q.id}" style="margin-top: 10px; font-size: 14px; font-weight: bold;"></div>
                `;
                quizContainer.appendChild(questionElement);
            });
        }

        // Funkcja sprawdzająca zaznaczone odpowiedzi
        function checkAllAnswers() {
            let score = 0;

            quizData.forEach((q) => {
                const checkedBoxes = document.querySelectorAll(`input[name="question-${q.id}"]:checked`);
                const userAnswers = Array.from(checkedBoxes).map(box => box.value);
                const feedbackDiv = document.getElementById(`feedback-${q.id}`);

                if (userAnswers.length === 0) {
                    feedbackDiv.innerHTML = "<span style='color: #e67e22;'>⚠️ Brak odpowiedzi!</span>";
                    return;
                }

                const isCorrect = q.correct.length === userAnswers.length && 
                                  q.correct.every(val => userAnswers.includes(val));

                if (isCorrect) {
                    feedbackDiv.innerHTML = "<span style='color: #27ae60;'>✓ Poprawna odpowiedź!</span>";
                    score++;
                } else {
                    const correctUpper = q.correct.map(letter => letter.toUpperCase()).join(", ");
                    feedbackDiv.innerHTML = `<span style='color: #c0392b;'>✗ Błędna odpowiedź. Poprawne to: ${correctUpper}</span>`;
                }
            });

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<h3>Twój wynik to: ${score} z ${quizData.length} punktów!</h3>`;
        }

        // Domyślne załadowanie pierwszego zestawu po wejściu na stronę
        window.onload = function() {
            loadQuizScript('pytania1.js', 'btn-p1');
        };
    </script>
</body>
</html>
