<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Kontroli Bezpieczeństwa ULC</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0275d8; margin-bottom: 20px; }
        .menu { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px; }
        .btn { background-color: #343a40; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn:hover { background-color: #23272b; }
        .btn.active { background-color: #0275d8; }
        .pytanie { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 6px; border-left: 5px solid #0275d8; }
        .pytanie p { margin-top: 0; font-size: 16px; line-height: 1.5; }
        label { display: block; padding: 8px 10px; margin: 4px 0; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        label:hover { background: #e9ecef; }
        input[type="checkbox"] { margin-right: 10px; transform: scale(1.2); }
        .status { margin-top: 10px; font-weight: bold; padding: 8px; border-radius: 4px; display: none; }
        #wynik-box { display: none; background: #e2f0d9; border: 2px solid #385723; color: #385723; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-radius: 6px; margin-top: 20px; }
        .action-box { text-align: center; margin-top: 25px; }
        .btn-check { background-color: #28a745; font-size: 18px; padding: 12px 30px; }
        .btn-check:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h1>Operator Kontroli Bezpieczeństwa ULC</h1>
    
    <div class="menu">
        <button class="btn active" id="m1" onclick="zmienZestaw(1)">Pytania 1 - 10</button>
        <button class="btn" id="m2" onclick="zmienZestaw(2)">Pytania 11 - 20</button>
        <button class="btn" id="m3" onclick="zmienZestaw(3)">Pytania 21 - 30</button>
        <button class="btn" id="m4" onclick="zmienZestaw(4)">Pytania 31 - 40</button>
    </div>

    <div id="box"></div>

    <div class="action-box">
        <button class="btn btn-check" onclick="sprawdzTest()">Sprawdź wynik</button>
    </div>

    <div id="wynik-box"></div>
</div>

<script>
// POPRAWIONE ZESTAWY 1 I 2 (pytania 1-20) zgodnie z kluczem
const p1 = [
    { id: 1, q: "1. Pasażer może wnieść...", o: { "a": "...", "b": "...", "c": "...", "d": "...", "e": "..." }, c: ["a", "d", "e"] },
    { id: 2, q: "2. Podczas kontroli bezpieczeństwa...", o: { "a": "...", "b": "...", "c": "...", "d": "...", "e": "...", "f": "..." }, c: ["c", "e"] },
    { id: 3, q: "3. Wskaż kategorie pasażerów...", o: { "a": "...", "b": "...", "c": "...", "d": "..." }, c: ["a", "d"] },
    { id: 4, q: "4. Kontrolę bezpieczeństwa...", o: { "a": "...", "b": "...", "c": "...", "d": "..." }, c: ["a", "b", "c", "d"] },
    { id: 5, q: "5. Sprzęt ułatwiający...", o: { "a": "...", "b": "...", "c": "...", "d": "..." }, c: ["b"] },
    { id: 6, q: "6. Wskaż osoby niebędące...", o: { "a": "...", "b": "...", "c": "...", "d": "...", "e": "..." }, c: ["c"] },
    { id: 7, q: "7. Funkcjonariusze SG...", o: { "a": "...", "b": "...", "c": "...", "d": "..." }, c: ["b"] },
    { id: 8, q: "8. Czasowa karta...", o: { "a": "...", "b": "...", "c": "...", "d": "...", "e": "..." }, c: ["d", "e"] },
    { id: 9, q: "9. Kartę identyfikacyjną...", o: { "a": "...", "b": "...", "c": "...", "d": "...", "e": "..." }, c: ["b", "c", "e"] },
    { id: 10, q: "10. Osoby niebędące...", o: { "a": "...", "b": "...", "c": "...", "d": "..." }, c: ["c"] }
];

const p2 = [
    { id: 11, q: "11. Kartę identyfikacyjną...", o: { "a": "...", "b": "...", "c": "...", "d": "..." }, c: ["d"] },
    { id: 12, q: "12. Po przeprowadzonej...", o: { "a": "...", "b": "...", "c": "..." }, c: ["a"] },
    { id: 13, q: "13. Ładunek i poczta...", o: { "a": "...", "b": "...", "c": "...", "d": "...", "e": "..." }, c: ["a", "b", "d"] },
    { id: 14, q: "14. Podczas kontroli...", o: { "a": "...", "b": "...", "c": "...", "d": "...", "e": "..." }, c: ["d"] },
    { id: 15, q: "15. Następujące przedmioty...", o: { "a": "...", "b": "...", "c": "...", "d": "..." }, c: ["d"] },
    { id: 16, q: "16. Następujące przedmioty...", o: { "a": "...", "b": "...", "c": "...", "d": "...", "e": "..." }, c: ["a", "b", "c"] },
    { id: 17, q: "17. Przedmioty zabronione...", o: { "a": "...", "b": "...", "c": "...", "d": "..." }, c: ["b", "c", "d"] },
    { id: 18, q: "18. Następujące przedmioty...", o: { "a": "...", "b": "...", "c": "...", "d": "...", "e": "...", "f": "..." }, c: ["b", "d", "e", "f"] },
    { id: 19, q: "19. Podczas kontroli...", o: { "a": "...", "b": "...", "c": "...", "d": "...", "e": "..." }, c: ["c", "d"] },
    { id: 20, q: "20. Podczas kontroli...", o: { "a": "...", "b": "...", "c": "..." }, c: ["b"] }
];

const p3 = [];
const p4 = [];

let baza = p1;

function zmienZestaw(nr) {
    document.getElementById('wynik-box').style.display = 'none';
    document.getElementById('m1').classList.toggle('active', nr === 1);
    document.getElementById('m2').classList.toggle('active', nr === 2);
    document.getElementById('m3').classList.toggle('active', nr === 3);
    document.getElementById('m4').classList.toggle('active', nr === 4);
    
    if (nr === 1) baza = p1;
    else if (nr === 2) baza = p2;
    else if (nr === 3) baza = p3;
    else if (nr === 4) baza = p4;
    
    rysujTest();
}

function rysujTest() {
    let html = '';
    if (baza.length === 0) {
        html = '<p style="text-align:center; color: #6c757d;">Ten zestaw pytań jest jeszcze pusty. Poproś o wygenerowanie danych!</p>';
    } else {
        baza.forEach(p => {
            html += `<div class="pytanie" id="block-${p.id}">
                <p><strong>${p.q}</strong></p>
                <div id="ans-${p.id}">`;
            for (let k in p.o) {
                html += `<label><input type="checkbox" name="p-${p.id}" value="${k}"> ${k.toUpperCase()}. ${p.o[k]}</label>`;
            }
            html += `</div><div class="status" id="stat-${p.id}"></div></div>`;
        });
    }
    document.getElementById('box').innerHTML = html;
}

function sprawdzTest() {
    if (baza.length === 0) return;
    let pkt = 0;
    
    baza.forEach(p => {
        let cb = document.querySelectorAll(`input[name="p-${p.id}"]:checked`);
        let odp = Array.from(cb).map(box => box.value);
        let statDiv = document.getElementById(`stat-${p.id}`);
        
        statDiv.style.display = 'block';
        
        if (odp.length === 0) {
            statDiv.style.color = 'orange';
            statDiv.innerHTML = '⚠️ Brak odpowiedzi!';
            return;
        }
        
        let ok = p.c.length === odp.length && p.c.every(v => odp.includes(v));
        if (ok) {
            statDiv.style.color = 'green';
            statDiv.innerHTML = '✓ Poprawna!';
            pkt++;
        } else {
            statDiv.style.color = 'red';
            statDiv.innerHTML = '✗ Błędna. Poprawna to: ' + p.c.join(', ').toUpperCase();
        }
    });
    
    let r = document.getElementById('wynik-box');
    r.style.display = 'block';
    r.innerHTML = 'Twój wynik w tym zestawie: ' + pkt + ' z ' + baza.length;
}

rysujTest();

</script>

</body>
</html>
